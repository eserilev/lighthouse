# Experimental consensus features. Run `make features` after each change.
#
# [eip1234]
# min_fork = "Heze"
# fork_version = { mainnet = "0x12340000", minimal = "0x12340001", gnosis = "0x12340064" }
# # Optional. The type is relative to `generated.rs` and implements `Default`, `Clone`, `Debug`,
# # `PartialEq` and serde.
# config = [{ name = "EIP1234_LIMIT", type = "u64" }]
# # Add `optional = true` to hold `Option<type>` in the spec, which is `None` until a config sets
# # the key. A config that the spec produces leaves the key out while it is `None`.

[eip8198]
min_fork = "Heze"
fork_version = { mainnet = "0xe8198000", minimal = "0xe8198001", gnosis = "0xe8198064" }
config = [
    { name = "SLOT_DURATION_SCHEDULE", type = "crate::core::SlotDurationSchedule", optional = true },
]
